# dsh-cockpit bundle patch.
# The independent slider package (dsh-effort-slider) is installed separately.
#
# Auto-continue is implemented on the official agent/request-error recovery
# waterfall. providerRetryMaxRetries is a deprecated compatibility key and is
# ignored: provider-level retry budgets belong to each provider's official
# retryPolicy.
- insert:
    - id: cockpit
      name: dsh-cockpit
      config:
        enabled: true
        maxAttempts: 6
        delayMs: 1500
        emitProminentError: true
