# dsh-cockpit bundle patch.
# The independent slider package (dsh-effort-slider) is installed separately.
#
# Auto-continue overrides the official retryPolicy through the documented
# agent/request-error waterfall, then adds extra continuations after the
# official executor gives up. providerRetryMaxRetries is the forced provider
# budget; maxAttempts is the extra continuation budget.
- insert:
    - id: cockpit
      name: dsh-cockpit
      config:
        enabled: true
        providerRetryMaxRetries: 3
        maxAttempts: 6
        delayMs: 1500
        emitProminentError: true
